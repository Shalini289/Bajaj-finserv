# Single Render service: API + React UI (no CORS issues)
services:
  - type: web
    name: bajaj-finserv
    runtime: node
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: STATIC_DIR
        value: ../frontend/dist
      - key: CLIENT_ORIGIN
        sync: false
