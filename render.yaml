# Deploy backend on Render — then deploy frontend separately with VITE_API_URL pointing here
services:
  - type: web
    name: deskflow-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
